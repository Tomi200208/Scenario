name: MiroFish on-demand run

on:
  workflow_dispatch:
    inputs:
      scenarioPilotRunId:
        description: Staged mirofish_runs UUID
        required: true
        type: string
      projectId:
        description: Owning project UUID
        required: true
        type: string

concurrency:
  group: mirofish-${{ inputs.scenarioPilotRunId }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: ${{ github.ref == 'refs/heads/main' && inputs.scenarioPilotRunId != '' }}
    environment: mirofish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.scenarioPilotRunId }}
      PROJECT_ID: ${{ inputs.projectId }}
      # Verified build 32573774120; update only after reviewing a new build.
      WORKER_IMAGE: ghcr.io/tomi200208/scenario-worker@sha256:b3dc73f9fa081f6aa9f191001a7b69ab1e85752713065a4b4b188bc05a5b8b8c
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MIROFISH_WORKER_TOKEN: ${{ secrets.MIROFISH_WORKER_TOKEN }}
      MIROFISH_CALLBACK_TOKEN: ${{ secrets.MIROFISH_CALLBACK_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL_NAME: ${{ vars.LLM_MODEL_NAME }}
      OASIS_DEFAULT_MAX_ROUNDS: ${{ vars.OASIS_DEFAULT_MAX_ROUNDS || '10' }}

    steps:
      - name: Validate dispatch and secrets
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
            MIROFISH_WORKER_TOKEN MIROFISH_CALLBACK_TOKEN \
            LLM_API_KEY ZEP_API_KEY LLM_BASE_URL LLM_MODEL_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions configuration $name is not configured."
              exit 1
            fi
          done
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if [[ ! "$RUN_ID" =~ $uuid ]] || [[ ! "$PROJECT_ID" =~ $uuid ]]; then
            echo "::error::workflow_dispatch must contain valid run and project UUIDs."
            exit 1
          fi

      - name: Start the worker container
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$WORKER_IMAGE"
          docker run -d --name miro -p 127.0.0.1:5001:5001 \
            -e PORT=5001 \
            -e FLASK_HOST=0.0.0.0 \
            -e FLASK_DEBUG=false \
            -e MIROFISH_WORKER_TOKEN \
            -e MIROFISH_CALLBACK_TOKEN \
            -e LLM_API_KEY \
            -e LLM_BASE_URL \
            -e LLM_MODEL_NAME \
            -e ZEP_API_KEY \
            -e OASIS_DEFAULT_MAX_ROUNDS \
            "$WORKER_IMAGE"

      - name: Wait for the worker to be ready
        shell: bash
        run: |
          set -euo pipefail
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --connect-timeout 2 --max-time 3 --silent --show-error --fail http://127.0.0.1:5001/sp/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' miro | grep -qx true; then
              echo "::error::MiroFish worker container stopped before becoming ready."
              exit 1
            fi
            sleep 2
          done
          echo "::error::MiroFish worker did not become ready after 30 attempts."
          exit 1

      - name: Fetch the staged seed bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          input_file="$RUNNER_TEMP/mirofish-run-input.json"
          curl --connect-timeout 10 --max-time 30 --silent --show-error --fail --get \
            "$SUPABASE_URL/rest/v1/mirofish_runs" \
            --data-urlencode "id=eq.$RUN_ID" \
            --data-urlencode "project_id=eq.$PROJECT_ID" \
            --data-urlencode "select=project_id,seed_bundle" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --output "$input_file"
          if [[ "$(jq 'length' "$input_file")" != "1" ]]; then
            echo "::error::The dispatched MiroFish run input was not found."
            exit 1
          fi
          callback_url="${SUPABASE_URL%/}/functions/v1/mirofish-notify"
          jq --exit-status \
            --arg run_id "$RUN_ID" \
            --arg project_id "$PROJECT_ID" \
            --arg callback_url "$callback_url" \
            --arg callback_token "$MIROFISH_CALLBACK_TOKEN" \
            '{
              scenarioPilotRunId: $run_id,
              projectId: $project_id,
              seedBundle: .[0].seed_bundle,
              callback: {url: $callback_url, token: $callback_token}
            }' "$input_file" >"$RUNNER_TEMP/mirofish-worker-payload.json"
          chmod 600 "$RUNNER_TEMP/mirofish-worker-payload.json"

      - name: Dispatch the run to the worker
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/mirofish-worker-response.json"
          http_status="$(curl --connect-timeout 5 --max-time 30 --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST http://127.0.0.1:5001/sp/runs \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MIROFISH_WORKER_TOKEN" \
            --data-binary "@$RUNNER_TEMP/mirofish-worker-payload.json")"
          if [[ "$http_status" != "202" ]]; then
            echo "::error::MiroFish worker rejected the run with HTTP $http_status."
            exit 1
          fi
          jq --exit-status --arg run_id "$RUN_ID" '.run_id == $run_id' "$response_file" >/dev/null

      - name: Wait for the run to finish
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if response="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --fail --get \
              "$SUPABASE_URL/rest/v1/mirofish_runs" \
              --data-urlencode "id=eq.$RUN_ID" \
              --data-urlencode "select=status" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"; then
              status="$(jq -r 'if length == 1 then .[0].status // empty else empty end' <<<"$response")"
              echo "MiroFish run status: ${status:-unavailable}"
              case "$status" in
                completed|failed|cancelled)
                  echo "status=$status" >>"$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            else
              echo "Supabase status check failed; retrying within the 20-minute budget."
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for MiroFish run $RUN_ID."
          exit 1

      - name: Worker state on failure (no raw logs containing project data)
        if: ${{ failure() || (steps.poll.outputs.status != '' && steps.poll.outputs.status != 'completed') }}
        shell: bash
        run: docker inspect --format 'running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' miro || true

      - name: Mark an orphaned run as failed
        if: ${{ failure() && steps.validate.outcome == 'success' && steps.poll.outputs.status == '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          failure_payload="$(jq -n \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              status: "failed",
              progress: 100,
              current_stage: "GitHub Actions worker failed",
              completed_at: $completed_at,
              error_message: "The on-demand MiroFish worker stopped before returning a terminal result."
            }')"
          # Atomic conditional update: never overwrite a completed callback.
          curl --connect-timeout 10 --max-time 30 --silent --show-error --fail \
            -X PATCH "$SUPABASE_URL/rest/v1/mirofish_runs?id=eq.$RUN_ID&project_id=eq.$PROJECT_ID&status=in.(queued,dispatching,running)" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "$failure_payload" >/dev/null

      - name: Clean up worker resources
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mirofish-worker-payload.json" "$RUNNER_TEMP/mirofish-run-input.json" "$RUNNER_TEMP/mirofish-worker-response.json"
          docker rm -f miro >/dev/null 2>&1 || true

      - name: Fail the workflow for a non-completed run
        if: ${{ steps.poll.outputs.status == 'failed' || steps.poll.outputs.status == 'cancelled' }}
        shell: bash
        run: |
          echo "::error::MiroFish run ended with status ${{ steps.poll.outputs.status }}."
          exit 1
